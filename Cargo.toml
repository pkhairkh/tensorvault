[package]
name = "tensorvault-bitcell"
version = "0.1.0"
edition = "2021"
authors = ["TensorVault Contributors"]
license = "MIT OR Apache-2.0"
description = "Phase-1 prototype of the niche-filled NaN-boxed Cell type for bit-uniform relational storage."
readme = "README.md"
keywords = ["database", "nan-boxing", "vectorized", "simd", "relational"]
categories = ["database-implementations", "data-structures"]

[lib]
name = "bitcell"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bytemuck = { version = "1.14", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false
path = "benches/throughput.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
