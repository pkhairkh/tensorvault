[package]
name = "turbogp"
version = "0.2.0"
edition = "2021"
authors = ["turboGP Contributors"]
license = "CCL-X-1.2"
description = "Instruction-first, memory-centric relational database engine. The kernel table is the moat."
readme = "README.md"
keywords = ["database", "kernel", "avx512", "memory-hierarchy", "oltp"]
categories = ["database-implementations"]

[lib]
name = "turbogp"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zero-copy / byte manipulation
bytemuck = { version = "1.14", features = ["derive"] }
# Memory-mapped I/O
memmap2 = "0.9"
# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Error handling
anyhow = "1"
thiserror = "1"
# Concurrency
parking_lot = "0.12"
# CPU detection
raw-cpuid = "11.0"
# Logging
tracing = "0.1"
# Parquet reader (for loading benchmark data)
parquet = "55"
arrow = "55"
# libc bindings for mmap/madvise (ADR-009 huge pages)
libc = "0.2"
# PRNG for MCTS join ordering (ADR-019 Wave 15)
rand = "0.9"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
regex = "1.10"
rust_decimal = "1.36"

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
# In-process DuckDB for benchmark baseline (Wave 2). `bundled` compiles libduckdb
# statically so no system libduckdb is required.
duckdb = { version = "1.1", features = ["bundled"] }
# In-process ClickHouse for benchmark baseline (Wave 3). Native TCP client to a
# running clickhouse-server — no CLI subprocess overhead.
clickhouse = { version = "0.15", features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "throughput"
harness = false
path = "benches/throughput.rs"

[[bench]]
name = "bench_kernels"
harness = false
path = "benches/bench_kernels.rs"

[[bench]]
name = "bench_tpch"
harness = false
path = "benches/bench_tpch.rs"

[[bench]]
name = "bench_sketches"
harness = false
path = "benches/bench_sketches.rs"

[[bench]]
name = "bench_wcoj"
harness = false
path = "benches/bench_wcoj.rs"

[[bench]]
name = "bench_cardinality"
harness = false
path = "benches/bench_cardinality.rs"

[[bench]]
name = "bench_planner"
harness = false
path = "benches/bench_planner.rs"

[[bench]]
name = "bench_eddy"
harness = false
path = "benches/bench_eddy.rs"

[[bench]]
name = "bench_tensor"
harness = false
path = "benches/bench_tensor.rs"

[[bench]]
name = "bench_3x_proof"
harness = false
path = "benches/bench_3x_proof.rs"

[[bench]]
name = "bench_tpch_full"
harness = false
path = "benches/bench_tpch_full.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"

[profile.bench]
opt-level = 3
lto = "thin"
